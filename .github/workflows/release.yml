name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-ubuntu:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload Ubuntu artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          body: "See the assets to download and install this version."
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          body: "See the assets to download and install this version."
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-macos:
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload macOS artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          body: "See the assets to download and install this version."
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/app/*.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Add Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Initialize Android project
        run: npm run tauri android init

      - name: Setup Android signing
        run: |
          # Create debug keystore for signing
          keytool -genkey -v -keystore src-tauri/gen/android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          # Create keystore.properties for Tauri build
          echo "keyAlias=androiddebugkey" > src-tauri/gen/android/keystore.properties
          echo "password=android" >> src-tauri/gen/android/keystore.properties
          echo "storeFile=debug.keystore" >> src-tauri/gen/android/keystore.properties

      - name: Build Android APK
        run: npm run tauri android build -- --apk

      - name: Build Android AAB
        run: npm run tauri android build -- --aab

      - name: Sign APK
        run: |
          # Find apksigner in Android SDK
          APK_SIGNER=$(find $ANDROID_HOME -name "apksigner" -type f 2>/dev/null | head -1)
          if [ -z "$APK_SIGNER" ]; then
            APK_SIGNER=$(find /opt -name "apksigner" -type f 2>/dev/null | head -1)
          fi
          # Sign the unsigned APK using apksigner
          UNSIGNED_APK=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          if [ -f "$UNSIGNED_APK" ] && [ -n "$APK_SIGNER" ]; then
            "$APK_SIGNER" sign --ks src-tauri/gen/android/debug.keystore --ks-pass pass:android --out "$UNSIGNED_APK.tmp" "$UNSIGNED_APK"
            mv "$UNSIGNED_APK.tmp" "$UNSIGNED_APK"
          fi

      - name: Rename Android artifacts
        run: |
          # Extract version from tag (e.g., v0.4.3-1 -> 0.4.3-1)
          VERSION=${GITHUB_REF_NAME#v}
          # Rename APK (could be signed or unsigned)
          if [ -f "src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk" ]; then
            mv src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "src-tauri/gen/android/app/build/outputs/apk/universal/release/PlanTodos_${VERSION}_aarch64-universal-release.apk"
          elif [ -f "src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk" ]; then
            mv src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk "src-tauri/gen/android/app/build/outputs/apk/universal/release/PlanTodos_${VERSION}_aarch64-universal-release.apk"
          fi
          # Rename AAB
          if [ -f "src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab" ]; then
            mv src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab "src-tauri/gen/android/app/build/outputs/bundle/universalRelease/PlanTodos_${VERSION}_aarch64-universal-release.aab"
          fi

      - name: Upload Android artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          body: "See the assets to download and install this version."
          draft: false
          prerelease: false
          files: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/PlanTodos_*.apk
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # iOS build - requires macOS runner and Apple Developer account for distribution
  # For testing without distribution: uses Xcode automatic signing with Personal Team
  # For App Store distribution: configure APPLE_API_* secrets
  release-ios:
    permissions:
      contents: write
    runs-on: macos-latest
    # Skip if no Apple secrets configured (optional build)
    # Remove this condition if you want to always build iOS
    # if: ${{ secrets.APPLE_API_ISSUER != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install npm dependencies
        run: npm ci

      - name: Initialize iOS project
        run: npm run tauri ios init -- --ci

      # Option 1: Use Xcode automatic signing with Personal Team (free Apple ID)
      # This creates a signed .ipa that can be installed on registered devices
      # Limitation: Only works on registered devices, expires after 7 days
      - name: Configure Xcode signing (Personal Team)
        run: |
          # Set the development team to your Apple ID's Personal Team
          # This requires APPLE_TEAM_ID secret (find in Xcode > Settings > Accounts)
          if [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            # Update the Xcode project with the team ID
            PROJECT_DIR="src-tauri/gen/apple"
            if [ -d "$PROJECT_DIR" ]; then
              # Set development team for all schemes
              xcodebuild -project "$PROJECT_DIR/PlanTodos.xcodeproj" \
                -scheme "PlanTodos" \
                -destination 'generic/platform=iOS' \
                DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
                CODE_SIGN_IDENTITY="Apple Development" \
                CODE_SIGN_STYLE=Automatic
            fi
          fi
        continue-on-error: true

      # Option 2: Use App Store Connect API for distribution signing
      # Requires: APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_PATH secrets
      - name: Configure App Store signing (if secrets available)
        if: ${{ secrets.APPLE_API_ISSUER != '' }}
        run: |
          echo "App Store Connect API signing configured"
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}

      - name: Build iOS (Release)
        run: |
          # Build for iOS device (ARM64)
          npm run tauri ios build -- --release --target aarch64-apple-ios
        continue-on-error: true

      - name: Build iOS Simulator (for testing)
        run: |
          # Build for iOS Simulator (ARM64 for M-series Macs)
          npm run tauri ios build -- --release --target aarch64-apple-ios-sim --simulator
        continue-on-error: true

      - name: Rename iOS artifacts
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          
          # Find and rename .ipa files
          IPA_PATH="src-tauri/target/aarch64-apple-ios/release/iphoneos/PlanTodos.ipa"
          if [ -f "$IPA_PATH" ]; then
            mkdir -p artifacts
            cp "$IPA_PATH" "artifacts/PlanTodos_${VERSION}_ios-arm64.ipa"
          fi
          
          # Find and rename .app for simulator
          APP_PATH="src-tauri/target/aarch64-apple-ios-sim/release/iphonesimulator/PlanTodos.app"
          if [ -d "$APP_PATH" ]; then
            cd src-tauri/target/aarch64-apple-ios-sim/release/iphonesimulator
            zip -r "../../../../../../artifacts/PlanTodos_${VERSION}_ios-simulator.zip" PlanTodos.app
          fi
          
          # Also check for xcarchive
          ARCHIVE_PATH=$(find src-tauri -name "*.xcarchive" -type d 2>/dev/null | head -1)
          if [ -n "$ARCHIVE_PATH" ]; then
            cd "$(dirname "$ARCHIVE_PATH")"
            zip -r "../../../../../../../artifacts/PlanTodos_${VERSION}_ios-archive.zip" "$(basename "$ARCHIVE_PATH")"
          fi
        continue-on-error: true

      - name: Upload iOS artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          body: "See the assets to download and install this version."
          draft: false
          prerelease: false
          files: |
            artifacts/*.ipa
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: iOS Build Status
        run: |
          echo "## iOS Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "artifacts/PlanTodos_*.ipa" ]; then
            echo "✅ iOS .ipa build successful" >> $GITHUB_STEP_SUMMARY
            echo "Note: For distribution, configure APPLE_API_* secrets" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ iOS build skipped or failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To enable iOS builds:" >> $GITHUB_STEP_SUMMARY
            echo "1. Add APPLE_TEAM_ID secret (from Xcode > Settings > Accounts)" >> $GITHUB_STEP_SUMMARY
            echo "2. For App Store: Add APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_PATH secrets" >> $GITHUB_STEP_SUMMARY
          fi
